<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة الأسئلة والقرعة</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #2ecc71;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(10px, env(safe-area-inset-top)) 15px max(10px, env(safe-area-inset-bottom)) 15px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            padding: 5px 0;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            width: 100%;
        }

        /* شريط الحالة */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .timer-display {
            font-size: 1rem;
            color: var(--accent-color);
            background: #fde8e8;
            padding: 4px 10px;
            border-radius: 15px;
        }

        .score-display {
            font-size: 1rem;
            color: var(--primary-color);
        }

        /* عجلة القرعة */
        .roulette-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wheel-container {
            position: relative;
            width: 160px;
            height: 160px;
            will-change: transform;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            position: relative;
            overflow: hidden;
            background: conic-gradient(
                #ff7675 0deg 90deg, 
                #74b9ff 90deg 180deg, 
                #55efc4 180deg 270deg, 
                #ffeaa7 270deg 360deg
            );
            /* التسريع بواسطة كارت الشاشة لمنع التعليق */
            transform: translateZ(0);
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            will-change: transform;
        }

        .pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 16px solid var(--accent-color);
            z-index: 10;
        }

        /* لوحة الأسئلة */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .grid-btn {
            aspect-ratio: 1.2;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .grid-btn:active {
            opacity: 0.8;
        }

        .grid-btn.disabled {
            background: #dcdde1;
            color: #7f8c8d;
            cursor: not-allowed;
        }

        .action-btn {
            width: 100%;
            padding: 10px;
            background: var(--secondary-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .action-btn:active {
            opacity: 0.85;
        }

        /* نافذة السؤال */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-btns button {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>لعبة التحدي والقرعة</h1>
        </header>

        <div class="card status-bar">
            <div class="timer-display">الوقت: <span id="timer">30</span>s</div>
            <div class="score-display">النقاط: <span id="score">0</span></div>
        </div>

        <div class="card roulette-section">
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel" id="wheel"></div>
            </div>
            <button class="action-btn" id="spin-btn" onclick="spinWheel()">تدوير القرعة</button>
        </div>

        <div class="card">
            <div class="board-grid" id="board"></div>
        </div>
    </div>

    <div class="modal" id="question-modal">
        <div class="modal-content">
            <h3 id="question-text">السؤال يظهر هنا...</h3>
            <div class="modal-btns">
                <button class="action-btn" onclick="answer(true)">إجابة صحيحة</button>
                <button class="action-btn" style="background: var(--accent-color);" onclick="answer(false)">إجابة خاطئة</button>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let isSpinning = false;
        let currentRotation = 0;

        // إنشاء شبكة الأزرار
        const board = document.getElementById('board');
        const fragment = document.createDocumentFragment();
        
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'grid-btn';
            btn.innerText = i;
            btn.onclick = () => openQuestion(btn);
            fragment.appendChild(btn);
        }
        board.appendChild(fragment);

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            
            const randomDegree = Math.floor(Math.random() * 360) + 1440; 
            currentRotation += randomDegree;
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                startTimer();
            }, 3000);
        }

        function openQuestion(btn) {
            if (btn.classList.contains('disabled')) return;
            
            document.getElementById('question-text').innerText = `سؤال رقم ${btn.innerText}`;
            document.getElementById('question-modal').style.display = 'flex';
            
            btn.classList.add('disabled');
            btn.disabled = true;
        }

        function answer(isCorrect) {
            document.getElementById('question-modal').style.display = 'none';
            clearInterval(timerInterval);

            if (isCorrect) {
                score += 10;
                document.getElementById('score').innerText = score;
            }
        }
    </script>
</body>
</html>
